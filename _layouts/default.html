<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
{% include head.html %}
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="site">
    {% include header.html %}
    <main id="main">
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
  <script>
    (function () {
      var b = document.querySelector('.nav-toggle'), n = document.getElementById('site-nav');
      if (!b || !n) return;
      var mq = window.matchMedia('(max-width: 640px)');
      function sync() { n.hidden = mq.matches && b.getAttribute('aria-expanded') !== 'true'; }
      b.addEventListener('click', function () {
        b.setAttribute('aria-expanded', b.getAttribute('aria-expanded') === 'true' ? 'false' : 'true');
        sync();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && b.getAttribute('aria-expanded') === 'true') { b.setAttribute('aria-expanded', 'false'); sync(); b.focus(); }
      });
      mq.addEventListener('change', sync);
      sync();
    })();
  </script>
  {%- if jekyll.environment == 'production' and site.google_analytics %}
  <script>window.VP_ANALYTICS={id:{{ site.google_analytics | jsonify }},home:{{ '/' | relative_url | jsonify }},privacy:{{ '/privacy' | relative_url | jsonify }}};</script>
  <script src="{{ '/assets/js/analytics.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}" defer></script>
  {%- endif %}
  {% if page.layout == 'album' %}<script src="{{ '/assets/js/viewer.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}" defer></script>{% endif %}
</body>
</html>
