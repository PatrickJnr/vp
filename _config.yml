title: PatrickJr's Virtual Photography
description: Virtual photography from the games I play, by PatrickJr.
url: https://vp.grimtech.co.uk
baseurl: ""
lang: en-GB
timezone: Europe/London

author:
  name: PatrickJr.
  email: admin@grimtech.co.uk
  url: https://vp.grimtech.co.uk
  twitter: _PatrickJnr

markdown: kramdown
permalink: /:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: rss-feed.xml
  posts_limit: 20

twitter:
  username: _PatrickJnr
  card: summary_large_image
social:
  name: PatrickJr.
  links:
    - https://x.com/_patrickjnr
    - https://www.flickr.com/photos/patrickjrcaulton/
    - https://steamcommunity.com/id/patrickjr
    - https://github.com/PatrickJnr

google_analytics: G-XXPKD9SFHL

defaults:
  - scope: {path: ""}
    values:
      image:
        path: /assets/gallery/og.jpg
        width: 1200
        height: 630
  - scope: {path: "", type: posts}
    values: {layout: album}
  - scope: {path: "", type: pages}
    values: {layout: page}

exclude:
  - tools
  - docs
  - tests
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - run.bat
  - generate_*.py
  - node_modules
  - vendor
  - .github
